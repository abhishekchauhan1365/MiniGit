name: Create Release Binaries

on:
  release:
    types: [created]

jobs:
  build-and-upload:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: mgit
            asset_name: mgit-linux-amd64
          - os: windows-latest
            artifact_name: mgit.exe
            asset_name: mgit-windows-amd64.exe
          - os: macos-latest
            artifact_name: mgit
            asset_name: mgit-macos-amd64

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config Release --target mgit

    - name: Prepare Binary (Linux/macOS)
      if: runner.os != 'Windows'
      run: cp ${{github.workspace}}/build/src/mgit ${{github.workspace}}/${{ matrix.asset_name }}

    - name: Prepare Binary (Windows)
      if: runner.os == 'Windows'
      run: copy ${{github.workspace}}\build\src\Release\mgit.exe ${{github.workspace}}\${{ matrix.asset_name }}

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      with:
        files: ${{github.workspace}}/${{ matrix.asset_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
